# Admin Voucher paths
/admin/voucher:
  get:
    tags:
      - Admin Voucher
    summary: Get all vouchers
    responses:
      "200":
        description: List of vouchers
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/VoucherOutput"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching vouchers
  post:
    tags:
      - Admin Voucher
    summary: Create a new voucher
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoucherInput"
    responses:
      "201":
        description: Voucher created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid voucher data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to create a voucher
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while creating the voucher

/admin/voucher/{id}:
  put:
    tags:
      - Admin Voucher
    summary: Update voucher by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoucherInput"
    responses:
      "200":
        description: Voucher updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid voucher data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to update this voucher
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Voucher not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while updating the voucher
  delete:
    tags:
      - Admin Voucher
    summary: Delete voucher by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Voucher deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              success:
                value:
                  status: success
                  message: Voucher deleted successfully
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to delete this voucher
      "404":
        description: Voucher not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Voucher not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while deleting the voucher
