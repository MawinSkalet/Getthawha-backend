# Admin Package paths - extracted from original swagger.json
/admin/package:
  get:
    tags:
      - Admin Package
    summary: Get all packages
    responses:
      "200":
        description: List of packages
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PackageOutput"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching packages
  post:
    tags:
      - Admin Package
    summary: Create a new package
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageInput"
    responses:
      "201":
        description: Package created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid package data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to create a package
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while creating the package

/admin/package/group:
  post:
    tags:
      - Admin Package
    summary: Create a menu item with multiple duration and price variants
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageGroupInput"
    responses:
      "201":
        description: Menu item created successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PackageOutput"
      "400":
        description: Invalid menu item data
      "401":
        description: Unauthorized
      "409":
        description: A menu item with this name already exists
      "500":
        description: Internal server error

/admin/package/group/{id}:
  put:
    tags:
      - Admin Package
    summary: Update a menu item and synchronize its duration variants
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageGroupInput"
    responses:
      "200":
        description: Menu item updated successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PackageOutput"
      "400":
        description: Invalid menu item data
      "401":
        description: Unauthorized
      "404":
        description: Menu item not found
      "409":
        description: A package with this exact name already exists
      "500":
        description: Internal server error
  delete:
    tags:
      - Admin Package
    summary: Remove a menu item and all of its variants from the active catalog
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Menu item removed successfully
      "401":
        description: Unauthorized
      "404":
        description: Menu item not found
      "500":
        description: Internal server error

/admin/package/{id}:
  put:
    tags:
      - Admin Package
    summary: Update package by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackageInput"
    responses:
      "200":
        description: Package updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid package data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to update this package
      "404":
        description: Package not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Package not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while updating the package
  delete:
    tags:
      - Admin Package
    summary: Delete package by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Package deleted successfully
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to delete this package
      "404":
        description: Package not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Package not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while deleting the package
