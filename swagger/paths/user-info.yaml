/userinfo/me:
  get:
    tags:
      - User
    summary: Get current user info
    description: Returns authenticated user info based on the `info` cookie.
    responses:
      "200":
        description: Authenticated user info
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInfoResponse"
      "401":
        description: Unauthorized - Missing or invalid user auth
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: Unauthorized access
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
      "404":
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: User not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: Internal server error
