/booking:
  get:
    tags:
      - Booking
    summary: Get all bookings of a user
    description: Retrieve all bookings for the authenticated user. Authentication can be done via cookie (info).
    parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
    responses:
      "200":
        description: List of bookings for the user
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BookingOutput"
      "401":
        description: Unauthorized - User authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
              invalidIdToken:
                value:
                  error: Invalid or expired ID token
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching bookings
  post:
    tags:
      - Booking
    summary: Create a new booking
    description: Creates a new booking for the authenticated user. Authentication can be provided via cookies.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BookingInput"
    responses:
      "201":
        description: Booking created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid booking data provided
      "401":
        description: Unauthorized - User authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
              invalidIdToken:
                value:
                  error: Invalid or expired ID token
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while creating the booking

/booking/{id}:
  put:
    tags:
      - Booking
    summary: Update booking by ID
    description: Updates an existing booking for the authenticated user. Authentication can be provided via cookies.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BookingUpdateInput"
    responses:
      "200":
        description: Booking updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid booking data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to update this booking
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Booking not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while updating the booking
  delete:
    tags:
      - Booking
    summary: Delete booking by ID
    description: Deletes an existing booking for the authenticated user. Authentication can be provided via cookies.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Booking deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              success:
                value:
                  status: success
                  message: Booking deleted successfully
      "401":
        description: Unauthorized - User authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to delete this booking
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
              invalidIdToken:
                value:
                  error: Invalid or expired ID token
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Booking not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while deleting the booking
