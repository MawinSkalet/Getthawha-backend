/admin/review:
  get:
    tags:
      - Admin Review
    summary: List user reviews
    description: Retrieves reviews with optional filtering by approval status. Requires admin authentication.
    parameters:
      - name: status
        in: query
        required: false
        description: Filter reviews by approval status
        schema:
          type: string
          enum:
            - approved
            - pending
    responses:
      "200":
        description: List of reviews
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ReviewWithBranchOutput"
      "401":
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while retrieving reviews

/admin/review/{id}/approval:
  patch:
    tags:
      - Admin Review
    summary: Update review approval status
    description: Approve or mark a review as pending. Requires admin authentication.
    parameters:
      - name: id
        in: path
        required: true
        description: Review identifier
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewApprovalInput"
    responses:
      "200":
        description: Review approval status updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOutput"
      "400":
        description: Bad request - missing or invalid body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidPayload:
                value:
                  status: error
                  message: isApproved must be provided as a boolean
      "401":
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
      "404":
        description: Review not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Review not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while updating review approval

/admin/review/{id}:
  delete:
    tags:
      - Admin Review
    summary: Delete a review
    description: Permanently deletes a review. Requires admin authentication.
    parameters:
      - name: id
        in: path
        required: true
        description: Review identifier
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Review deleted successfully
      "401":
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "403":
        description: Forbidden - Invalid or expired token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidToken:
                value:
                  error: Invalid or expired token
      "404":
        description: Review not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Review not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while deleting the review
