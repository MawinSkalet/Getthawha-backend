      example: Thai Massage
    description:
      type: string
      example: Traditional Thai massage
    pictureUrl:
      type: string
      format: uri
      nullable: true
    note:
      type: string
      nullable: true
    isActive:
      type: boolean
      default: true
    variants:
      type: array
      minItems: 1
      items:
        type: object
        properties:
          duration:
            type: integer
            enum:
              - 60
              - 90
              - 120
          price:
            type: number
            exclusiveMinimum: 0
        required:
          - duration
          - price
  required:
    - type
    - category
    - title
    - description
    - variants

