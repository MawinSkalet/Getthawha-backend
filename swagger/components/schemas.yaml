BookingOutput:
  type: object
  properties:
    id:
      type: string
      example: 4394f1e7-2392-4fbd-9799-5c3d1665a659
    date:
      type: string
      format: date-time
      example: "2023-10-01T12:00:00.000Z"
    duration:
      type: integer
      example: 30
    totalPrice:
      type: string
      example: "25.00"
    status:
      type: string
      enum:
        - pending
        - confirmed
        - cancelled
        - completed
      example: pending
    user:
      type: object
      properties:
        id:
          type: string
          example: Ub11f11111ff1f1edda111
        displayName:
          type: string
          example: Yung
        pictureUrl:
          type: string
          format: uri
          example: "https://profile.line-scdn.net/..."
      required:
        - id
        - displayName
        - pictureUrl
    branch:
      type: object
      properties:
        id:
          type: string
          example: 13369aad-ee3b-4c23-b210-384b08ee3513
        name:
          type: string
          example: Main Branch
      required:
        - id
        - name
    package:
      type: object
      properties:
        id:
          type: string
          example: 50e91e6c-1387-4402-818a-7879c0409675
        title:
          type: string
          example: XYZ Massage
      required:
        - id
        - title
    voucher:
      type:
        - object
        - "null"
      nullable: true
      properties:
        id:
          type: string
          example: voucher-id-123
        code:
          type: string
          example: DISCOUNT50
      required:
        - id
        - code
  required:
    - id
    - date
    - duration
    - totalPrice
    - status
    - user
    - branch
    - package

