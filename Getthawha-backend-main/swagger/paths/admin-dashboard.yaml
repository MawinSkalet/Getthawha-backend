# Admin Dashboard paths
/admin/dashboard:
  get:
    tags:
      - Admin Dashboard
    summary: Get dashboard overview statistics
    description: Retrieve key metrics for the admin dashboard including total bookings, revenue, users, and today's bookings
    responses:
      "200":
        description: Dashboard statistics retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                totalBookings:
                  type: integer
                  example: 1234
                totalRevenue:
                  type: number
                  format: float
                  example: 125500.75
                totalUsers:
                  type: integer
                  example: 567
                todayBooking:
                  type: integer
                  example: 15
              required:
                - totalBookings
                - totalRevenue
                - totalUsers
                - todayBooking
      "401":
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching dashboard data

/admin/dashboard/trending:
  get:
    tags:
      - Admin Dashboard
    summary: Get monthly booking trends
    description: Retrieve monthly booking statistics for trend analysis throughout the year
    responses:
      "200":
        description: Monthly booking trends retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: January
                  totalBookings:
                    type: integer
                    example: 123
                required:
                  - name
                  - totalBookings
      "401":
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching trending data

