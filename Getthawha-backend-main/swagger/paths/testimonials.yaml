/review/testimonials:
  get:
    tags:
      - Review
    summary: List top testimonials
    description: Returns up to six approved reviews ordered by rating (highest first) and most recent submission.
    responses:
      "200":
        description: List of testimonials
        content:
          application/json:
            schema:
              type: array
              maxItems: 6
              items:
                $ref: "#/components/schemas/ReviewWithBranchOutput"
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while retrieving testimonials
