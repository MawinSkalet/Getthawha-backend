/admin/booking:
  get:
    tags:
      - Admin Booking
    summary: Get all bookings for admin
    parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
    responses:
      "200":
        description: List of all bookings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BookingOutput"
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to access this resource
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while fetching bookings
  post:
    tags:
      - Admin Booking
    summary: Create a new booking as admin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BookingWithUserInput"
    responses:
      "201":
        description: Booking created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid booking data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to create a booking
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while creating the booking

/admin/booking/{id}:
  put:
    tags:
      - Admin Booking
    summary: Update booking by ID as admin
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BookingAdminUpdateInput"
    responses:
      "200":
        description: Booking updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingOutput"
      "400":
        description: Bad request, invalid input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              invalidInput:
                value:
                  status: error
                  message: Invalid booking data provided
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to update this booking
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Booking not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while updating the booking
  delete:
    tags:
      - Admin Booking
    summary: Delete booking by ID as admin
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Booking deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              success:
                value:
                  status: success
                  message: Booking deleted successfully
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              unauthorized:
                value:
                  status: error
                  message: User not authorized to delete this booking
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              notFound:
                value:
                  status: error
                  message: Booking not found
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
            examples:
              error:
                value:
                  status: error
                  message: An error occurred while deleting the booking
