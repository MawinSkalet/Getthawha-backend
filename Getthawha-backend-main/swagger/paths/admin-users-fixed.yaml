# Admin Users paths
/admin/user:
  get:
    tags:
      - Admin Users
    summary: Get all users
    description: Retrieve a paginated list of all registered users
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number for pagination (default: 1)
    responses:
      '200':
        description: Users retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserOutput'
      '401':
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'

/admin/user/search:
  get:
    tags:
      - Admin Users
    summary: Search users by display name
    description: Search for users by their display name using case-insensitive partial matching
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Search query to match against user display names
    responses:
      '200':
        description: Users found successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserOutput'
      '401':
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'

/admin/user/{id}:
  get:
    tags:
      - Admin Users
    summary: Get user by ID
    description: Retrieve a specific user by their ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the user
    responses:
      '200':
        description: User retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserOutput'
      '401':
        description: Unauthorized - Admin authentication required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
